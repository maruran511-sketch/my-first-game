<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>はじめての横スクロールゲーム</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #f4f7ff; color: #243047;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .game-wrap { width: min(100vw, 1000px); padding: 14px; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 0 2px 10px; }
    h1 { font-size: clamp(18px, 3vw, 25px); margin: 0; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    #bgmToggle, #restart {
      border: 0; border-radius: 999px; padding: 9px 15px; background: #243047;
      color: white; font-weight: 700; cursor: pointer;
    }
    #bgmToggle { background: #237c68; }
    #bgmToggle[aria-pressed="false"] { background: #778399; }
    .stage { position: relative; overflow: hidden; border: 4px solid white; border-radius: 18px; box-shadow: 0 12px 35px #52658b26; background: #9fe4ff; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
    .help { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin: 10px 4px 0; font-size: 13px; color: #536079; }
    .key { display: inline-block; padding: 3px 8px; border: 1px solid #c8d1e3; border-radius: 6px; background: white; color: #26344d; font-weight: 700; }
    .touch { display: none; justify-content: space-between; gap: 14px; margin-top: 12px; }
    .touch-group { display: flex; gap: 10px; }
    .touch button { width: 62px; height: 54px; border: 0; border-radius: 14px; background: #fff; color: #26344d; font-size: 23px; font-weight: 800; box-shadow: 0 3px 0 #d5dced; touch-action: none; }
    .touch button:active { transform: translateY(2px); box-shadow: 0 1px 0 #d5dced; }
    @media (pointer: coarse) { .touch { display: flex; } }
  </style>
</head>
<body>
  <main class="game-wrap">
    <header>
      <h1>🌟 はじめての横スクロールゲーム</h1>
      <div class="header-actions">
        <button id="bgmToggle" type="button" aria-pressed="true" aria-label="BGMをオフにする">🎵 BGM ON</button>
        <button id="restart" type="button">最初から</button>
      </div>
    </header>
    <div class="stage">
      <canvas id="game" width="960" height="540" aria-label="コインを集めて旗を目指すゲーム"></canvas>
    </div>
    <div class="help">
      <span><span class="key">←</span> <span class="key">→</span> または <span class="key">A</span> <span class="key">D</span>：移動</span>
      <span><span class="key">スペース</span> / <span class="key">↑</span>：ジャンプ</span>
      <span>敵は上から踏むと倒せる！星が飛び散って100点ゲット。横から触れるとライフが減るよ。</span>
      <span>黄色い「？」ブロックは下から叩くとコインが出るよ！</span>
      <span>🔊 効果音あり・🎵 BGMは最初の操作後に再生（右上のボタンでON/OFF）</span>
    </div>
    <div class="touch" aria-label="タッチ操作">
      <div class="touch-group">
        <button id="leftBtn" aria-label="左へ">◀</button>
        <button id="rightBtn" aria-label="右へ">▶</button>
      </div>
      <button id="jumpBtn" aria-label="ジャンプ">⤒</button>
    </div>
  </main>

<script>
(() => {
  // ===== 1. ゲームの基本設定 =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;
  const WORLD_WIDTH = 2700;
  const GROUND_Y = 470;
  const GOAL_X = 2530;
  const NEED_COINS = 5;

  // ===== 2. ステージに置くもの =====
  const platforms = [
    { x: 260, y: 395, w: 135 },
    { x: 500, y: 345, w: 145 },
    { x: 790, y: 400, w: 145 },
    { x: 1040, y: 350, w: 150 },
    { x: 1330, y: 390, w: 150 },
    { x: 1580, y: 325, w: 155 },
    { x: 1880, y: 390, w: 155 },
    { x: 2150, y: 345, w: 155 }
  ];
  const coinStarts = [
    [150, 425], [315, 355], [555, 305], [720, 425],
    [865, 360], [1105, 310], [1260, 425], [1400, 350],
    [1640, 285], [1800, 425], [1950, 350], [2210, 305], [2390, 425]
  ];
  // 下から叩ける「？」ブロック。1つにつきコインが1枚出る。
  const blockStarts = [
    { x: 210, y: 340 },
    { x: 690, y: 320 },
    { x: 1210, y: 340 },
    { x: 1690, y: 300 },
    { x: 2290, y: 320 }
  ];
  let coins;
  let bonusCoins;
  let blocks;
  let enemies;
  let starParticles = []; // 敵を倒したときに飛び散る星
  let player;
  let cameraX = 0;
  let collected = 0;
  let score = 0; // 敵を倒すと100点ずつ加算
  let lives = 3;
  let gameState = 'playing'; // playing / won / need-more / game-over
  let messageTimer = 0;

  // ===== 0. オリジナル効果音（Web Audio API） =====
  // 外部音源は使わず、ブラウザ内で短い音を合成する。
  // 音声は最初のキー操作／タッチ操作のあとに有効になる。
  let audioContext = null;
  let bgmEnabled = true;
  let bgmTimer = null;
  let bgmStep = 0;
  let nextBgmTime = 0;
  const BGM_BPM = 112;
  const BGM_STEP_SECONDS = 60 / BGM_BPM / 2; // 8分音符
  // オリジナルの明るい8ビット風メロディ（MIDI音程）。nullは休符。
  const BGM_MELODY = [72, 76, 79, null, 76, 79, 84, null, 81, 79, 76, null, 74, 76, 79, null];
  const BGM_BASS = [48, null, 48, null, 53, null, 53, null, 55, null, 55, null, 50, null, 50, null];

  function unlockAudio() {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;
    try {
      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === 'suspended') {
        const resumeResult = audioContext.resume();
        if (resumeResult && typeof resumeResult.then === 'function') {
          resumeResult.then(() => { if (bgmEnabled) startBgm(); }).catch(() => {});
        }
      } else if (audioContext.state === 'running' && bgmEnabled) {
        startBgm();
      }
      return audioContext;
    } catch (error) {
      // 音声に対応していない環境でもゲーム自体は遊べる。
      return null;
    }
  }

  function midiToFrequency(note) {
    return 440 * Math.pow(2, (note - 69) / 12);
  }

  function scheduleBgmNote(ac, midiNote, startAt, duration, waveType, volume) {
    const oscillator = ac.createOscillator();
    const gain = ac.createGain();
    oscillator.type = waveType;
    oscillator.frequency.setValueAtTime(midiToFrequency(midiNote), startAt);
    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.exponentialRampToValueAtTime(volume, startAt + 0.012);
    gain.gain.setValueAtTime(volume, Math.max(startAt + 0.013, startAt + duration * 0.55));
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
    oscillator.connect(gain);
    gain.connect(ac.destination);
    oscillator.start(startAt);
    oscillator.stop(startAt + duration + 0.02);
  }

  function scheduleBgm() {
    const ac = audioContext;
    if (!bgmEnabled || !ac || ac.state !== 'running') return;
    const scheduleUntil = ac.currentTime + 0.14;
    while (nextBgmTime < scheduleUntil) {
      const index = bgmStep % BGM_MELODY.length;
      const melodyNote = BGM_MELODY[index];
      const bassNote = BGM_BASS[index];
      if (melodyNote !== null) {
        scheduleBgmNote(ac, melodyNote, nextBgmTime, BGM_STEP_SECONDS * 0.78, 'square', 0.012);
      }
      if (bassNote !== null) {
        scheduleBgmNote(ac, bassNote, nextBgmTime, BGM_STEP_SECONDS * 0.9, 'triangle', 0.025);
      }
      // 4拍ごとに控えめな低音を入れて、リズムを作る。
      if (index % 4 === 0) {
        scheduleBgmNote(ac, 36, nextBgmTime, 0.11, 'sine', 0.018);
      }
      nextBgmTime += BGM_STEP_SECONDS;
      bgmStep++;
    }
  }

  function startBgm() {
    if (!bgmEnabled || !audioContext || audioContext.state !== 'running' || bgmTimer !== null) return;
    bgmStep = 0;
    nextBgmTime = audioContext.currentTime + 0.04;
    scheduleBgm();
    bgmTimer = window.setInterval(scheduleBgm, 25);
  }

  function stopBgm() {
    if (bgmTimer !== null) {
      window.clearInterval(bgmTimer);
      bgmTimer = null;
    }
  }

  function updateBgmButton() {
    const button = document.getElementById('bgmToggle');
    if (!button) return;
    button.textContent = bgmEnabled ? '🎵 BGM ON' : '🔇 BGM OFF';
    button.setAttribute('aria-pressed', String(bgmEnabled));
    button.setAttribute('aria-label', bgmEnabled ? 'BGMをオフにする' : 'BGMをオンにする');
  }

  function toggleBgm() {
    bgmEnabled = !bgmEnabled;
    updateBgmButton();
    if (bgmEnabled) {
      const ac = unlockAudio();
      if (ac && ac.state === 'running') startBgm();
    } else {
      stopBgm();
    }
  }

  // 最初のキー操作／画面タッチで音声を解放し、BGMを開始する。
  // BGMボタン自身のクリックは除外し、ON/OFF操作を優先する。
  function handleAudioGesture(event) {
    const target = event && event.target;
    if (target && typeof target.closest === 'function' && target.closest('#bgmToggle')) return;
    unlockAudio();
  }
  window.addEventListener('pointerdown', handleAudioGesture);
  window.addEventListener('keydown', handleAudioGesture);

  function playTone(startFrequency, endFrequency, duration, type, volume, delay = 0) {
    const ac = unlockAudio();
    if (!ac) return;

    const play = () => {
      if (ac.state !== 'running') return;
      const startAt = ac.currentTime + delay;
      const oscillator = ac.createOscillator();
      const gain = ac.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(startFrequency, startAt);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, endFrequency), startAt + duration);
      gain.gain.setValueAtTime(0.0001, startAt);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), startAt + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
      oscillator.connect(gain);
      gain.connect(ac.destination);
      oscillator.start(startAt);
      oscillator.stop(startAt + duration + 0.015);
    };

    if (ac.state === 'running') {
      play();
    } else if (ac.state === 'suspended') {
      ac.resume().then(play).catch(() => {});
    }
  }

  function playBlockHitSound() {
    // 低めの「ポコッ／コツッ」。
    playTone(245, 118, 0.105, 'triangle', 0.13);
    playTone(510, 330, 0.055, 'sine', 0.035, 0.008);
  }

  function playCoinPopSound() {
    // コインが飛び出すときの明るい2音。
    playTone(760, 1040, 0.09, 'sine', 0.065);
    playTone(1080, 1460, 0.12, 'sine', 0.075, 0.075);
  }

  function playCoinCollectSound() {
    // コイン取得時の短いキラッとした音。
    playTone(980, 1320, 0.075, 'sine', 0.055);
    playTone(1320, 1660, 0.095, 'sine', 0.05, 0.055);
  }

  function playEnemyStompSound() {
    // 敵を踏んだ瞬間の、低くて軽いオリジナルの「ポンッ！」。
    // 3つの短い音を重ね、既存のブロック／コイン音と区別する。
    playTone(190, 68, 0.145, 'triangle', 0.14);
    playTone(520, 245, 0.085, 'sine', 0.05, 0.012);
    playTone(110, 55, 0.105, 'sine', 0.055, 0.018);
  }

  // 敵を倒した位置から、星の紙吹雪が四方に飛び散る。
  function spawnStarBurst(x, y) {
    const colors = ['#ffe45e', '#fff6b0', '#ff9fcb', '#8ee7ff', '#ffffff'];
    for (let i = 0; i < 12; i++) {
      const angle = (Math.PI * 2 * i / 12) + (Math.random() - 0.5) * 0.28;
      const speed = 2.2 + Math.random() * 3.1;
      const life = 24 + Math.floor(Math.random() * 12);
      starParticles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 0.8,
        gravity: 0.13 + Math.random() * 0.08,
        size: 5 + Math.random() * 4,
        rotation: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.22,
        life, maxLife: life,
        color: colors[i % colors.length]
      });
    }
  }

  function updateStarParticles() {
    for (const particle of starParticles) {
      particle.x += particle.vx;
      particle.y += particle.vy;
      particle.vy += particle.gravity;
      particle.vx *= 0.985;
      particle.rotation += particle.spin;
      particle.life--;
    }
    starParticles = starParticles.filter((particle) => particle.life > 0);
  }

  function drawStarParticles() {
    for (const particle of starParticles) {
      const fade = Math.min(1, particle.life / 8, particle.life / particle.maxLife + 0.18);
      ctx.save();
      ctx.globalAlpha = Math.max(0, fade);
      ctx.translate(particle.x, particle.y);
      ctx.rotate(particle.rotation);
      ctx.fillStyle = particle.color;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      for (let point = 0; point < 10; point++) {
        const radius = point % 2 === 0 ? particle.size : particle.size * 0.43;
        const angle = -Math.PI / 2 + point * Math.PI / 5;
        const px = Math.cos(angle) * radius;
        const py = Math.sin(angle) * radius;
        if (point === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  // 敵の配置。platformY がある敵は足場の上を歩く
  const enemyStarts = [
    { x: 420, minX: 410, maxX: 465, platformY: GROUND_Y, speed: 1.25 },
    { x: 535, minX: 505, maxX: 605, platformY: 345, speed: 1.05 },
    { x: 955, minX: 945, maxX: 1010, platformY: GROUND_Y, speed: 1.35 },
    { x: 1360, minX: 1335, maxX: 1440, platformY: 390, speed: 1.15 },
    { x: 1765, minX: 1745, maxX: 1825, platformY: GROUND_Y, speed: 1.3 },
    { x: 2180, minX: 2155, maxX: 2260, platformY: 345, speed: 1.1 },
    { x: 2370, minX: 2350, maxX: 2430, platformY: GROUND_Y, speed: 1.25 }
  ];
  const keys = { left: false, right: false };
  let jumpQueued = false;

  function resetGame() {
    player = { x: 55, y: GROUND_Y - 48, w: 34, h: 48, vx: 0, vy: 0, onGround: true, face: 1, hitTimer: 0, knockbackX: 0 };
    coins = coinStarts.map(([x, y]) => ({ x, y, taken: false, phase: Math.random() * Math.PI * 2 }));
    bonusCoins = [];
    blocks = blockStarts.map((block) => ({ ...block, w: 38, h: 34, used: false, bumpTimer: 0 }));
    enemies = enemyStarts.map((enemy) => ({
      ...enemy,
      y: enemy.platformY - 30,
      w: 36,
      h: 30,
      dir: 1,
      alive: true,
      anim: Math.random() * Math.PI * 2
    }));
    starParticles = [];
    cameraX = 0;
    collected = 0;
    score = 0;
    lives = 3;
    gameState = 'playing';
    messageTimer = 0;
  }

  // ===== 3. キーボード操作 =====
  window.addEventListener('keydown', (e) => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', ' ', 'Spacebar'].includes(e.key)) e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;
    if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'Spacebar' || e.key.toLowerCase() === 'w') jumpQueued = true;
    if (e.key.toLowerCase() === 'r') resetGame();
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
  });
  window.addEventListener('blur', () => { keys.left = false; keys.right = false; });

  // スマホでも遊べるように、画面上のボタンにも操作を割り当てる
  function bindHoldButton(id, keyName) {
    const button = document.getElementById(id);
    const down = (e) => { e.preventDefault(); keys[keyName] = true; };
    const up = (e) => { e.preventDefault(); keys[keyName] = false; };
    button.addEventListener('pointerdown', down);
    button.addEventListener('pointerup', up);
    button.addEventListener('pointerleave', up);
    button.addEventListener('pointercancel', up);
  }
  bindHoldButton('leftBtn', 'left');
  bindHoldButton('rightBtn', 'right');
  document.getElementById('jumpBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); jumpQueued = true; });
  document.getElementById('restart').addEventListener('click', resetGame);
  document.getElementById('bgmToggle').addEventListener('click', toggleBgm);
  updateBgmButton();

  // ===== 4. プレイヤーを動かす =====
  function update() {
    // 敵を倒したあとの星の粒子は、ゲーム状態に関係なく最後まで散らす。
    updateStarParticles();
    // ゴール前でコイン不足のメッセージを表示している間は、少し待って操作を再開する
    if (gameState === 'need-more') {
      if (messageTimer > 0) messageTimer--;
      if (messageTimer === 0) gameState = 'playing';
      return;
    }
    if (gameState !== 'playing') return;

    const previousTop = player.y;
    const previousBottom = player.y + player.h;
    const moveSpeed = 4.4;

    // ブロックの揺れを少しずつ止める
    for (const block of blocks) {
      if (block.bumpTimer > 0) block.bumpTimer--;
    }

    // 敵を左右にパトロールさせる
    for (const enemy of enemies) {
      if (!enemy.alive) continue;
      enemy.x += enemy.speed * enemy.dir;
      if (enemy.x <= enemy.minX) { enemy.x = enemy.minX; enemy.dir = 1; }
      if (enemy.x + enemy.w >= enemy.maxX) { enemy.x = enemy.maxX - enemy.w; enemy.dir = -1; }
      enemy.anim += 0.12;
    }

    player.vx = 0;
    if (keys.left) { player.vx = -moveSpeed; player.face = -1; }
    if (keys.right) { player.vx = moveSpeed; player.face = 1; }
    // ダメージを受けた直後は少し押し戻される
    player.vx += player.knockbackX;
    player.knockbackX *= 0.82;
    if (Math.abs(player.knockbackX) < 0.15) player.knockbackX = 0;
    if (player.hitTimer > 0) player.hitTimer--;
    player.x += player.vx;
    player.x = Math.max(0, Math.min(WORLD_WIDTH - player.w, player.x));

    if (jumpQueued && player.onGround) {
      player.vy = -13.2;
      player.onGround = false;
    }
    jumpQueued = false;

    player.vy += 0.58; // 重力。数字を大きくすると落下が速くなる
    player.y += player.vy;
    const wasFalling = player.vy > 0;
    const wasRising = player.vy < 0;
    player.onGround = false;

    // ジャンプ中、頭がブロックの下側に当たったか調べる
    if (wasRising) {
      for (const block of blocks) {
        const overlapsX = player.x + player.w > block.x + 3 && player.x < block.x + block.w - 3;
        const crossedUnderside = previousTop >= block.y + block.h && player.y <= block.y + block.h;
        if (overlapsX && crossedUnderside) {
          player.y = block.y + block.h;
          player.vy = 0;
          block.bumpTimer = 12;
          playBlockHitSound();
          if (!block.used) {
            block.used = true;
            playCoinPopSound();
            // コインがブロックから飛び出し、ブロックの上に落ち着く
            bonusCoins.push({
              x: block.x + block.w / 2,
              y: block.y - 12,
              restY: block.y - 18,
              vy: -7.5,
              active: true,
              settled: false,
              phase: Math.random() * Math.PI * 2
            });
          }
          break;
        }
      }
    }

    // ブロックから出たコインを上に飛ばし、その後ブロックの上に置く
    for (const coin of bonusCoins) {
      if (!coin.active || coin.settled) continue;
      coin.y += coin.vy;
      coin.vy += 0.34;
      if (coin.vy > 0 && coin.y >= coin.restY) {
        coin.y = coin.restY;
        coin.vy = 0;
        coin.settled = true;
      }
    }

    // 地面に着地
    if (player.vy >= 0 && previousBottom <= GROUND_Y && player.y + player.h >= GROUND_Y) {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
    // 足場の上に着地（下からすり抜けられる簡単な足場）
    if (player.vy >= 0) {
      for (const p of platforms) {
        const overlaps = player.x + player.w > p.x && player.x < p.x + p.w;
        if (overlaps && previousBottom <= p.y && player.y + player.h >= p.y) {
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
        }
      }
      // ？ブロックの上にも着地できる
      for (const block of blocks) {
        const overlaps = player.x + player.w > block.x && player.x < block.x + block.w;
        if (overlaps && previousBottom <= block.y && player.y + player.h >= block.y) {
          player.y = block.y - player.h;
          player.vy = 0;
          player.onGround = true;
        }
      }
    }

    // 敵との当たり判定
    for (const enemy of enemies) {
      if (!enemy.alive) continue;
      const overlapsX = player.x + player.w > enemy.x + 4 && player.x < enemy.x + enemy.w - 4;
      const overlapsY = player.y + player.h > enemy.y + 3 && player.y < enemy.y + enemy.h;
      if (!overlapsX || !overlapsY) continue;

      // 落下中に敵の頭へ着地したら踏みつけ成功
      if (wasFalling && previousBottom <= enemy.y + 16) {
        enemy.alive = false;
        score += 100; // 敵を1体倒すごとに100点
        playEnemyStompSound();
        spawnStarBurst(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2);
        player.y = enemy.y - player.h;
        player.vy = -8.8; // 踏むと少し高く跳ね返る
        player.onGround = false;
      } else if (player.hitTimer === 0) {
        // 横や下から触れるとライフを1つ失い、少し無敵になる
        lives--;
        if (lives <= 0) {
          gameState = 'game-over';
        } else {
          player.hitTimer = 100;
          player.knockbackX = (player.x + player.w / 2 < enemy.x + enemy.w / 2) ? -5.2 : 5.2;
          player.vy = -6.5;
        }
      }
      break;
    }

    // コインを取る
    for (const coin of coins) {
      if (coin.taken) continue;
      const dx = (player.x + player.w / 2) - coin.x;
      const dy = (player.y + player.h / 2) - coin.y;
      if (Math.hypot(dx, dy) < 34) {
        coin.taken = true;
        collected++;
        playCoinCollectSound();
      }
    }
    // ブロックから出たボーナスコインも触れると獲得
    for (const coin of bonusCoins) {
      if (!coin.active) continue;
      const dx = (player.x + player.w / 2) - coin.x;
      const dy = (player.y + player.h / 2) - coin.y;
      if (Math.hypot(dx, dy) < 34) {
        coin.active = false;
        collected++;
        playCoinCollectSound();
      }
    }

    // 落ちた場合はスタート地点に戻す
    if (player.y > H + 100) {
      player.x = Math.max(30, player.x - 180);
      player.y = GROUND_Y - player.h;
      player.vy = 0;
    }

    // カメラをプレイヤーに追いかけさせる
    cameraX = Math.max(0, Math.min(WORLD_WIDTH - W, player.x - W * 0.38));

    // ゴール判定
    if (player.x > GOAL_X && player.x < GOAL_X + 90) {
      if (collected >= NEED_COINS) gameState = 'won';
      else { gameState = 'need-more'; messageTimer = 100; player.x = GOAL_X - 5; }
    }
  }

  // ===== 5. ステージを描く =====
  function roundedRect(x, y, w, h, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#8edfff');
    sky.addColorStop(1, '#effcff');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // 遠くの山
    ctx.fillStyle = '#b6e7c8';
    for (let i = -1; i < 7; i++) {
      const x = i * 210 - (cameraX * 0.18 % 210);
      ctx.beginPath();
      ctx.arc(x + 90, 455, 125, Math.PI, 0);
      ctx.fill();
    }
    // 雲
    ctx.fillStyle = '#ffffffcc';
    for (let i = 0; i < 6; i++) {
      const x = ((i * 230 + 80 - cameraX * 0.32) % (W + 260) + (W + 260)) % (W + 260) - 100;
      const y = 80 + (i % 3) * 55;
      ctx.beginPath();
      ctx.arc(x, y, 25, 0, Math.PI * 2);
      ctx.arc(x + 28, y - 10, 31, 0, Math.PI * 2);
      ctx.arc(x + 60, y, 24, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawWorld() {
    // 地面
    ctx.fillStyle = '#64bd59';
    ctx.fillRect(0, GROUND_Y, WORLD_WIDTH, H - GROUND_Y);
    ctx.fillStyle = '#b9794b';
    ctx.fillRect(0, GROUND_Y + 18, WORLD_WIDTH, H - GROUND_Y - 18);
    for (let x = 0; x < WORLD_WIDTH; x += 48) {
      ctx.fillStyle = '#9b613e';
      ctx.fillRect(x, GROUND_Y + 35, 2, 18);
      ctx.fillRect(x + 23, GROUND_Y + 65, 2, 15);
    }
    // 足場
    for (const p of platforms) {
      roundedRect(p.x, p.y, p.w, 18, 6, '#b9794b');
      ctx.fillStyle = '#70c95e';
      ctx.fillRect(p.x, p.y, p.w, 6);
      ctx.fillStyle = '#8e5637';
      for (let x = p.x + 20; x < p.x + p.w; x += 38) ctx.fillRect(x, p.y + 8, 2, 9);
    }

    // ？ブロック（1回叩くと空っぽのブロックになる）
    for (const block of blocks) {
      const bump = block.bumpTimer > 0 ? Math.sin((block.bumpTimer / 12) * Math.PI) * 7 : 0;
      const bx = block.x;
      const by = block.y - bump;
      roundedRect(bx, by, block.w, block.h, 5, block.used ? '#a87545' : '#f6b936');
      ctx.strokeStyle = block.used ? '#80532f' : '#d68b20';
      ctx.lineWidth = 3;
      ctx.strokeRect(bx + 1.5, by + 1.5, block.w - 3, block.h - 3);
      ctx.fillStyle = block.used ? '#c08b58' : '#fff1a6';
      ctx.font = 'bold 25px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(block.used ? '·' : '?', bx + block.w / 2, by + 26);
      ctx.textAlign = 'left';
    }

    // ブロックから飛び出したボーナスコイン
    for (const coin of bonusCoins) {
      if (!coin.active) continue;
      const bob = coin.settled ? Math.sin(performance.now() / 220 + coin.phase) * 2 : 0;
      ctx.save();
      ctx.translate(coin.x, coin.y + bob);
      ctx.fillStyle = '#ffcf3f';
      ctx.beginPath();
      ctx.ellipse(0, 0, 11, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#e99a19';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#fff2a5';
      ctx.fillRect(-3, -8, 3, 8);
      ctx.restore();
    }

    // コイン
    for (const coin of coins) {
      if (coin.taken) continue;
      const bob = Math.sin(performance.now() / 240 + coin.phase) * 4;
      ctx.save();
      ctx.translate(coin.x, coin.y + bob);
      ctx.fillStyle = '#ffcf3f';
      ctx.beginPath();
      ctx.ellipse(0, 0, 11, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#e99a19';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#fff2a5';
      ctx.fillRect(-3, -8, 3, 8);
      ctx.restore();
    }

    // ゴールの旗
    ctx.fillStyle = '#f5f5f5';
    ctx.fillRect(GOAL_X + 22, GROUND_Y - 130, 7, 130);
    ctx.fillStyle = '#ff5f75';
    ctx.beginPath();
    ctx.moveTo(GOAL_X + 29, GROUND_Y - 128);
    ctx.lineTo(GOAL_X + 95, GROUND_Y - 108);
    ctx.lineTo(GOAL_X + 29, GROUND_Y - 87);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e7eaf2';
    ctx.fillRect(GOAL_X + 8, GROUND_Y, 36, 8);
  }

  function drawEnemies() {
    for (const enemy of enemies) {
      if (!enemy.alive) continue;
      const bob = Math.sin(enemy.anim) * 1.5;
      const x = enemy.x;
      const y = enemy.y + bob;
      ctx.save();
      // ぷにぷにモンスターの足
      ctx.fillStyle = '#385b43';
      const step = Math.sin(enemy.anim * 1.8) * 3;
      ctx.beginPath();
      ctx.ellipse(x + 10, y + 27 + step, 7, 4, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 26, y + 27 - step, 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      // 体と頭
      ctx.fillStyle = '#57b96a';
      ctx.beginPath();
      ctx.moveTo(x + 2, y + 25);
      ctx.quadraticCurveTo(x - 2, y + 8, x + 9, y + 4);
      ctx.quadraticCurveTo(x + 18, y - 2, x + 27, y + 5);
      ctx.quadraticCurveTo(x + 38, y + 10, x + 34, y + 25);
      ctx.quadraticCurveTo(x + 18, y + 33, x + 2, y + 25);
      ctx.fill();
      // 頭の葉っぱ
      ctx.fillStyle = '#31894c';
      ctx.beginPath();
      ctx.ellipse(x + 18, y + 4, 9, 4, -0.2, 0, Math.PI * 2);
      ctx.fill();
      // 目
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x + 12, y + 15, 4.5, 0, Math.PI * 2);
      ctx.arc(x + 25, y + 15, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#243047';
      ctx.beginPath();
      ctx.arc(x + 13 + enemy.dir, y + 16, 2, 0, Math.PI * 2);
      ctx.arc(x + 24 + enemy.dir, y + 16, 2, 0, Math.PI * 2);
      ctx.fill();
      // ちいさな口
      ctx.strokeStyle = '#2d7042';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x + 18, y + 21, 3, 0.15, Math.PI - 0.15);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawPlayer() {
    if (player.hitTimer > 0 && Math.floor(player.hitTimer / 7) % 2 === 0) return;
    const x = player.x;
    const y = player.y;
    // 影
    ctx.fillStyle = '#29435a33';
    ctx.beginPath();
    ctx.ellipse(x + player.w / 2, Math.min(GROUND_Y + 4, y + player.h + 3), 18, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    // 体
    roundedRect(x + 4, y + 16, 26, 29, 7, '#2584e8');
    // 顔
    roundedRect(x + 3, y + 2, 28, 23, 8, '#ffd3a4');
    // 帽子
    roundedRect(x + 1, y, 32, 10, 5, '#ff6d5f');
    ctx.fillStyle = '#243047';
    const eyeX = player.face === 1 ? x + 23 : x + 10;
    ctx.beginPath();
    ctx.arc(eyeX, y + 14, 2.2, 0, Math.PI * 2);
    ctx.fill();
    // 足
    roundedRect(x + 2, y + 41, 13, 7, 3, '#60483d');
    roundedRect(x + 19, y + 41, 13, 7, 3, '#60483d');
  }

  function drawHud() {
    roundedRect(18, 16, 430, 58, 14, '#ffffffdf');
    ctx.fillStyle = '#26344d';
    ctx.font = 'bold 21px system-ui, sans-serif';
    ctx.fillText(`🪙 ${collected} / ${NEED_COINS}`, 32, 42);
    ctx.font = 'bold 19px system-ui, sans-serif';
    ctx.fillStyle = '#e75b68';
    ctx.fillText(`❤ ${lives}`, 172, 42);
    ctx.fillStyle = '#26344d';
    ctx.font = 'bold 19px system-ui, sans-serif';
    ctx.fillText(`★ ${score.toLocaleString('ja-JP')}`, 270, 42);
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillStyle = '#52627c';
    ctx.fillText('コイン', 34, 61);
    ctx.fillText('ライフ', 172, 61);
    ctx.fillText('スコア', 273, 61);

    if (gameState === 'need-more') {
      drawMessage('あと少し！', `コインをあと${NEED_COINS - collected}枚集めよう`);
    }
    if (gameState === 'won') {
      drawMessage('ステージクリア！', 'やったね！「最初から」で何度でも遊べるよ');
    }
    if (gameState === 'game-over') {
      drawMessage('ゲームオーバー', 'ライフがなくなったよ。「最初から」または R キーで再挑戦！');
    }
  }

  function drawMessage(title, subtitle) {
    ctx.fillStyle = '#17243b99';
    ctx.fillRect(0, 0, W, H);
    roundedRect(170, 185, 620, 160, 22, '#ffffff');
    ctx.textAlign = 'center';
    ctx.fillStyle = '#243047';
    ctx.font = 'bold 38px system-ui, sans-serif';
    ctx.fillText(title, W / 2, 250);
    ctx.font = '18px system-ui, sans-serif';
    ctx.fillStyle = '#586780';
    ctx.fillText(subtitle, W / 2, 292);
    ctx.textAlign = 'left';
  }

  // ===== 6. 毎フレーム、動かして描く =====
  function frame() {
    update();
    drawBackground();
    ctx.save();
    ctx.translate(-cameraX, 0);
    drawWorld();
    drawEnemies();
    drawStarParticles();
    drawPlayer();
    ctx.restore();
    drawHud();
    requestAnimationFrame(frame);
  }

  resetGame();
  frame();
})();
</script>
